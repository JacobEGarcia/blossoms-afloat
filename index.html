<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Blossoms Afloat</title>
<meta name="description" content="Flowers dropping into sea water. A real-time three.js water shader study."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#0d2b2e;
    --card:rgba(255,255,255,.58);
    --card-border:rgba(255,255,255,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#bfe6ea;color:var(--ink)}
  #scene{position:fixed;inset:0;display:block;cursor:crosshair}
  .ui{position:fixed;inset:0;pointer-events:none;user-select:none}
  .title{
    position:absolute;top:28px;left:32px;
    font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:clamp(34px,4.6vw,58px);line-height:.95;color:#fff;
    text-shadow:0 1px 18px rgba(6,60,66,.35);letter-spacing:-.01em;
  }
  .panel{
    position:absolute;top:24px;right:24px;width:216px;pointer-events:auto;
    background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border);border-radius:16px;padding:14px 14px 12px;
    box-shadow:0 8px 30px rgba(10,70,78,.14);
  }
  .panel h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#28555b;margin:0 2px 9px}
  .opt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;color:#123b40}
  .opt:hover{background:rgba(255,255,255,.5)}
  .opt input{display:none}
  .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.15)}
  .opt.sel{background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(10,70,78,.12)}
  .clear{
    margin-top:10px;width:100%;padding:9px 0;border:0;border-radius:11px;cursor:pointer;
    font:600 13px Inter,sans-serif;color:#fff;background:#14656e;letter-spacing:.01em;
    transition:background .15s ease;
  }
  .clear:hover{background:#0f5259}
  .hint{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    font-size:13px;font-weight:500;color:#fff;white-space:nowrap;
    background:rgba(9,60,66,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:8px 16px;border-radius:999px;text-shadow:0 1px 4px rgba(0,40,44,.4);
  }
  .credit{
    position:absolute;bottom:22px;left:28px;font-size:11.5px;color:rgba(255,255,255,.85);
    text-shadow:0 1px 6px rgba(6,60,66,.4);letter-spacing:.01em;
  }
  .credit a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5)}
  #fallback{position:fixed;inset:0;display:none;place-items:center;background:#dff1f3;text-align:center;padding:24px;font-size:15px}
  @media (max-width:640px){
    .title{top:20px;left:20px}
    .panel{top:auto;bottom:76px;right:14px;width:186px}
    .credit{display:none}
    .hint{bottom:20px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui">
  <div class="title">Blossoms<br/>afloat.</div>
  <div class="panel">
    <h2>Drop a blossom</h2>
    <div id="opts"></div>
    <button class="clear" id="clear">Clear the water</button>
  </div>
  <div class="hint">Pick a flower, then click the water to drop it in.</div>
  <div class="credit">a shader study after <a href="https://x.com/ann_nnng/status/2098353630848160192" target="_blank" rel="noopener">@ann_nnng</a> · three.js</div>
</div>
<div id="fallback"><div>This piece needs WebGL.<br/>Please open it in a modern browser.</div></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
